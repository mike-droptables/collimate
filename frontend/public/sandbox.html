<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // The module mirror (api/routes/mirror.py): the import map sends both
        // module CDNs to <apiBase>/api/mirror/<host>/, before any module
        // script runs; loadCss maps stylesheets the same way.
        (() => {
            const apiBase = (new URLSearchParams(location.search).get('apiBase') || '').replace(/\/$/, '');
            const base = new URL(apiBase + '/', location.href).href + 'api/mirror/';
            // GENERATED by sdk/scripts/sync_mirror_hosts.py from sdk/src/collimate/module_mirror_contract.json `upstreams`; do not edit.
            const hosts = ['esm.sh', 'cdn.jsdelivr.net'];
            // END GENERATED
            window.__collimateMirrorBase = base;
            window.__collimateMirrorHosts = hosts;
            const map = document.createElement('script');
            map.type = 'importmap';
            map.textContent = JSON.stringify({ imports: Object.fromEntries(hosts.map((host) => [`https://${host}/`, `${base}${host}/`])) });
            document.currentScript.after(map);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox</title>
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :where(html) { font-size: 110%; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #mount { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="mount"></div>
    <!-- The workbench's scrollbars in this frame (lib/scrollbars, bundled
         by scripts/build-scrollbars.mjs): the sheet, the activity mark
         and the thumb drag, the same as the host's document. -->
    <script type="module" src="/scrollbars.js"></script>
    <script type="module">
        // ---------------------------------------------------------------
        // 1. Internal postMessage plumbing (hidden from renderers)
        // ---------------------------------------------------------------
        const _pending = new Map();
        let _nextId = 1;
        const _filesChangedCbs = [];
        const _surfaceChangedCbs = [];
        const _themeChangeCbs = [];
        const _editingChangeCbs = [];
        const _styleChangeCbs = [];
        // Operation-bound serialization requests from the host.
        // Renderers subscribe through api.onFlush.
        const _flushCbs = [];
        const _setContentCbs = [];
        const _documentSnapshotCbs = [];
        // Annotation requests (api.onAnnotationRequest): the one handler this
        // view has, and the requests it is answering by requestId. Never kept
        // in _pending: a request is the host's to retry, so PING_READY
        // re-announces only the capability, which a host re-acquiring this
        // pooled frame missed while it was parked.
        let _annotationHandler = null;
        let _announcedCapable = false;
        const _annotationJobs = new Map();
        function _announceAnnotationCapable(force) {
            const capable = !!_annotationHandler;
            if (!force && capable === _announcedCapable) return;
            _announcedCapable = capable;
            _postToParent({ type: 'ANNOTATION_CAPABLE', capable });
        }
        function _answerAnnotation(requestId, fields) {
            try { _postToParent({ type: 'ANNOTATION_RESULT', requestId, ...fields }); }
            catch (error) { _postToParent({ type: 'ANNOTATION_RESULT', requestId, error: 'The renderer answered with a value that cannot be sent.' }); }
        }
        const _viewId = crypto.randomUUID();
        let _viewSeq = 0;
        let _documentContent = null;
        let _documentSnapshot = {content:'',editSeq:0,materializedSeq:0};
        const _fileRevisions = new Map();
        let _documentReadOnly = false;
        let _canInteract = false;

        // Theme signal: the parent pushes SET_THEME after RENDERER_READY and
        // on every theme change. Cached so a synchronous api.getTheme() at
        // bootstrap resolves without a round trip. Until the first message
        // the placeholder says so with `known: false`.
        let _currentTheme = { themeId: 'unknown', scheme: 'dark', known: false, vars: {}, fonts: { ui: '', mono: '', prose: '' } };
        // Editing preferences: the parent pushes SET_EDITING with the theme
        // and on every change. Until then, the browser's own default.
        let _currentEditing = { spellcheck: true };
        // This renderer's style choices (theme, font, text size; null = its
        // default) and the font catalogue its style control offers: the
        // parent pushes SET_STYLE with the theme, once the renderer is ready
        // and on every change to this renderer's record.
        let _currentStyle = { theme: null, font: null, textSize: null };
        let _fontFamilies = Object.freeze([]);
        // Signalled once the renderer declares itself ready. Idempotent —
        // parent discards duplicates, but we guard here too so a renderer
        // calling ready() twice doesn't post two messages.
        let _readyFired = false;

        function _postToParent(msg) {
            window.parent.postMessage(msg, '*');
        }

        function _fireReady() {
            if (_readyFired) return;
            _readyFired = true;
            _postToParent({ type: 'RENDERER_READY' });
        }

        function _previewPrimitive(type, args = {}, signal) {
            return new Promise((resolve, reject) => {
                if(signal?.aborted){reject(new Error('Preview preparation was revoked'));return;}
                const id = _nextId++;
                signal?.addEventListener('abort',()=>_postToParent({type:'CANCEL_PREPARE_RENDERER_DEPENDENCIES',id}),{once:true});
                const timer = setTimeout(() => {
                    _pending.delete(id);
                    reject(new Error('Renderer preview request timed out'));
                }, 35000);
                // Kept for PING_READY, which re-sends it while unanswered.
                const request = {type, id, ...args};
                _pending.set(id, {resolve, reject, timer, request, signal});
                _postToParent(request);
            });
        }

        // Only this renderer's displayed own path is an alias. Every other
        // cell path and every host message continues to name the stored file.
        const _fileParams = new URLSearchParams(window.location.search);
        const _realFilename = _fileParams.get('filename') || '';
        const _displayFilename = _fileParams.get('displayName') || _realFilename;
        const _realPath = path => path === _displayFilename ? _realFilename : path;

        function _getSiblingFile(path) {
            return new Promise((resolve, reject) => {
                const id = _nextId++;
                const timer = setTimeout(() => {
                    if (_pending.has(id)) {
                        _pending.delete(id);
                        reject(new Error(`Timeout fetching sibling: ${path}`));
                    }
                }, 10000);
                _pending.set(id, { resolve, reject, timer });
                _postToParent({ type: 'SIBLING_READ', id, path });
            });
        }

        // Committed text write into the renderer's OWN cell — the parent
        // routes it through applyCellFiles, so the bytes are immediately
        // readable back via getSiblingFile. Unlike the read side this NEVER
        // rejects: a parent refusal, a host with no sibling files at all, or
        // the timeout all resolve false, so a renderer's retry logic has one
        // branch to reason about.
        function _saveSiblingFile(path, content) {
            return new Promise((resolve) => {
                const id = _nextId++;
                const timer = setTimeout(() => {
                    if (_pending.has(id)) {
                        _pending.delete(id);
                        resolve(false);
                    }
                }, 10000);
                _pending.set(id, { resolve, reject: () => resolve(false), timer });
                _postToParent({ type: 'SIBLING_WRITE', id, path, content });
            });
        }

        // ---------------------------------------------------------------
        // 2. Message bus — routes parent replies to callbacks
        // ---------------------------------------------------------------
        window.addEventListener('message', (e) => {
            if (e.source !== window.parent || e.origin !== window.location.origin) return;
            const data = e.data;
            if (!data || typeof data !== 'object') return;

            if (data.type === 'PREVIEW_PRIMITIVE_RESULT') {
                const pending = _pending.get(data.id);
                if (pending) {
                    clearTimeout(pending.timer); _pending.delete(data.id);
                    if (data.error) pending.reject(new Error(data.error));
                    else pending.resolve(data.value);
                }
            }
            if (data.type === 'SIBLING_READ_RESULT') {
                const p = _pending.get(data.id);
                if (p) {
                    clearTimeout(p.timer);
                    _pending.delete(data.id);
                    if (data.error) p.reject(Object.assign(new Error(data.error),
                        typeof data.status === 'number' ? { status: data.status } : {}));
                    else p.resolve(data.content);
                }
            }

            if (data.type === 'SIBLING_WRITE_RESULT') {
                // Boolean-only by contract — `reason` is host diagnostics
                // (mid-run refusal, no such cell) and never surfaces to the
                // renderer as a rejection.
                const p = _pending.get(data.id);
                if (p) {
                    clearTimeout(p.timer);
                    _pending.delete(data.id);
                    p.resolve(!!data.ok);
                }
            }

            if (data.type === 'SURFACE_CHANGED') {
                const params = new URLSearchParams(window.location.search);
                if (params.get('versionId') || data.cellId !== (params.get('cellId') || '')
                    || data.path !== _realFilename) return;
                for (const cb of _surfaceChangedCbs) {
                    try { cb(); } catch (err) { console.error('surface-changed callback error:', err); }
                }
            }

            if (data.type === 'SET_DOCUMENT' && typeof data.content === 'string') {
                if(typeof data.readOnly==='boolean')_documentReadOnly=data.readOnly;
                if(typeof data.canInteract==='boolean')_canInteract=data.canInteract;
                // A captured host snapshot may precede newer edits already emitted by this physical view.
                if ((data.viewAcks?.[_viewId] ?? 0) < _viewSeq) return;
                _documentSnapshot = {content:data.content,recovery:data.recovery,
                    editSeq:data.editSeq ?? 0,materializedSeq:data.materializedSeq ?? 0};
                for (const cb of _documentSnapshotCbs) cb(_documentSnapshot);
                if (_documentSnapshot.materializedSeq === _documentSnapshot.editSeq && _documentContent !== data.content) {
                    _documentContent = data.content;
                    for (const cb of _setContentCbs) cb(data.content);
                }
            }
            if (data.type === 'FILES_CHANGED') {
                for (const file of data.files || []) _fileRevisions.set(file.path, file.file_revision);
                // Cell-scoped: ignore commits for other cells so a busy
                // neighbour doesn't make this renderer refetch its files.
                const _ownCellId = new URLSearchParams(window.location.search).get('cellId') || '';
                if (data.cellId && _ownCellId && data.cellId !== _ownCellId) return;
                const detail = { cellId: data.cellId, changedFiles: Array.isArray(data.changedFiles) ? data.changedFiles.map(path => path === _realFilename ? _displayFilename : path) : data.changedFiles };
                for (const cb of _filesChangedCbs) {
                    try { cb(detail); } catch (err) { console.error('files-changed callback error:', err); }
                }
            }

            if (data.type === 'PING_READY') {
                // Pool re-use path: a new SandboxIframe just mounted over this
                // pooled frame (every acquire pings, after a park too). It
                // missed the original RENDERER_READY. If we already fired
                // ready, echo it back now so the new overlay drops immediately.
                if (_readyFired) _postToParent({ type: 'RENDERER_READY' });
                // The new host also missed whether this renderer takes
                // annotation requests. Only that state is re-announced; an
                // annotation request is never re-sent from here.
                _announceAnnotationCapable(true);
                // It also missed what we asked while no host owned us: a
                // parked frame keeps booting, the pool hands its messages to
                // no one, and the host bridge (lib/sandboxBridge) drops a
                // request, or the answer it was still working on, once its
                // owner lets go. The ping is the one notice that a host owns
                // us again, so re-send every unanswered preview request under
                // its own id. Each is a read, a pure compile or an idempotent
                // registration (a preparation job is deduplicated by id, and a
                // cancelled one is not re-sent), and the first answer settles
                // it: a duplicate finds no pending entry.
                for (const pending of _pending.values()) {
                    if (pending.request && !pending.signal?.aborted) _postToParent(pending.request);
                }
            }

            if (data.type === 'SET_KEYBINDINGS') {
                // Parent pushed its current allowedInRenderer shortcut set.
                // We replace wholesale — parent is the source of truth and
                // reposts on remap. Safe to ignore malformed payloads.
                _forwardedCombos = Array.isArray(data.combos) ? data.combos : [];
            }

            if (data.type === 'SET_THEME') {
                // The parent's theme snapshot: every skin token keyed by its
                // CSS name. Each is mirrored onto this frame's :root verbatim,
                // so a renderer's `var(--sheet-2)` sees the live skin without
                // calling api.getTheme().
                const scheme = data.scheme === 'light' ? 'light' : 'dark';
                const vars = (data.vars && typeof data.vars === 'object') ? data.vars : {};
                const fonts = (data.fonts && typeof data.fonts === 'object') ? data.fonts : {};
                const themeId = (typeof data.themeId === 'string' && data.themeId) ? data.themeId : 'unknown';
                _currentTheme = { themeId, scheme, known: data.known === true, vars, fonts };
                const root = document.documentElement;
                for (const [name, value] of Object.entries(vars)) {
                    if (name.startsWith('--') && typeof value === 'string') root.style.setProperty(name, value);
                }
                // color-scheme lets native controls (scrollbars, form
                // widgets) take the skin's scheme.
                root.style.setProperty('color-scheme', scheme);
                root.setAttribute('data-theme', themeId);
                root.setAttribute('data-scheme', scheme);
                for (const cb of _themeChangeCbs) {
                    try { cb(_currentTheme); } catch (err) { console.error('theme-change callback error:', err); }
                }
            }

            if (data.type === 'SET_EDITING') {
                // The host's editing preferences. Spellcheck goes on this
                // frame's <html>, which every editable that leaves the
                // attribute unset inherits (the milkdown renderer's Crepe
                // included); a renderer whose editor sets its own, or runs in
                // a frame of its own, follows api.onEditingChange.
                _currentEditing = { spellcheck: data.spellcheck !== false };
                document.documentElement.setAttribute('spellcheck', String(_currentEditing.spellcheck));
                for (const cb of _editingChangeCbs) {
                    try { cb(_currentEditing); } catch (err) { console.error('editing-change callback error:', err); }
                }
            }

            if (data.type === 'SET_STYLE') {
                const style = data.style || {};
                _currentStyle = {
                    theme: typeof style.theme === 'string' ? style.theme : null,
                    font: typeof style.font === 'string' ? style.font : null,
                    textSize: typeof style.textSize === 'number' && Number.isFinite(style.textSize) ? style.textSize : null,
                };
                if (Array.isArray(data.fonts)) {
                    _fontFamilies = Object.freeze(data.fonts
                        .filter(f => f && typeof f.family === 'string' && typeof f.stack === 'string')
                        .map(f => Object.freeze({ family: f.family, label: String(f.label ?? f.family), role: f.role, stack: f.stack })));
                }
                for (const cb of _styleChangeCbs) {
                    try { cb({ ..._currentStyle }); } catch (err) { console.error('style-change callback error:', err); }
                }
            }

            if (data.type === 'ANNOTATION_REQUEST') {
                // The host asks this view for context (a user attaching part
                // of the file to a message). ACK at once when a handler takes
                // it, so the host's 2s deadline holds only for a silent frame;
                // the answer follows whenever the user is done.
                const requestId = data.requestId;
                if (typeof requestId !== 'string' || !requestId || requestId.length > 128 || _annotationJobs.has(requestId)) return;
                const handler = _annotationHandler;
                if (!handler) { _answerAnnotation(requestId, { unsupported: true }); return; }
                if (data.mode !== 'pick' && data.mode !== 'selection') { _answerAnnotation(requestId, { error: 'Unknown annotation mode.' }); return; }
                if (!_canInteract) { _answerAnnotation(requestId, { unavailable: 'This view takes no annotations.' }); return; }
                const controller = new AbortController();
                _annotationJobs.set(requestId, controller);
                _postToParent({ type: 'ANNOTATION_ACK', requestId });
                const request = { id: requestId, mode: data.mode, ...(typeof data.hint === 'string' && data.hint ? { hint: data.hint.slice(0, 200) } : {}) };
                const settle = (fields) => {
                    if (_annotationJobs.get(requestId) !== controller) return;
                    _annotationJobs.delete(requestId);
                    _answerAnnotation(requestId, fields);
                };
                Promise.resolve().then(() => handler(request, controller.signal)).then(
                    (context) => settle({ context: context ?? null }),
                    (error) => {
                        const message = String(error?.message || error);
                        settle(error?.name === 'AnnotationUnavailable' ? { unavailable: message } : { error: message });
                    });
            }
            if (data.type === 'ANNOTATION_CANCEL') {
                // The host gave up on the request (Esc, cancel, a newer one):
                // abort the handler's signal and answer, so the job is gone.
                const controller = _annotationJobs.get(data.requestId);
                if (controller) {
                    _annotationJobs.delete(data.requestId);
                    controller.abort();
                    _answerAnnotation(data.requestId, { cancelled: true });
                }
            }

            if (data.type === 'FLUSH_DRAFT') {
                // Host asked the editor to flush its pending debounced
                // save now (generator modal Save). Run every flush cb,
                // then ack so the host's bounded wait resolves. Flush cbs
                // may be async, so wait on all before acking.
                const requestId = data.requestId;
                Promise.all(_flushCbs.map(cb=>Promise.resolve().then(cb))).then(() => {
                    _postToParent({ type: 'FLUSH_DRAFT_ACK', requestId });
                }, error => {
                    _postToParent({ type: 'FLUSH_DRAFT_ACK', requestId, error: String(error?.message || error) });
                });
            }
        });


        // ---------------------------------------------------------------
        // 3. Keyboard forwarding — parent pushes a dynamic list of combos
        // it wants bubbled up out of the renderer. Combos arrive already
        // resolved to the host's platform (Mod → metaKey on Mac, ctrlKey
        // elsewhere) so the iframe just does a boolean compare.
        // ---------------------------------------------------------------
        let _forwardedCombos = [];
        const _forwardedReleaseKeys = new Set();
        function _eventMatchesCombo(e, c) {
            const evKey = (e.key && e.key.length === 1) ? e.key.toLowerCase() : e.key;
            const cKey  = (c.key && c.key.length === 1) ? c.key.toLowerCase() : c.key;
            if (c.code ? e.code !== c.code : evKey !== cKey) return false;
            if (Boolean(e.metaKey)  !== Boolean(c.metaKey))  return false;
            if (Boolean(e.ctrlKey)  !== Boolean(c.ctrlKey))  return false;
            if (Boolean(e.altKey)   !== Boolean(c.altKey))   return false;
            if (Boolean(e.shiftKey) !== Boolean(c.shiftKey)) return false;
            return true;
        }
        window.addEventListener('keydown', (e) => {
            // A bare Escape belongs to the double-tap handler below, which
            // owns the decision of when (and whether) to forward it. Skipping
            // it here means this loop can never preventDefault a first Esc the
            // renderer still needs to close its own popover.
            if (e.key === 'Escape' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) return;
            for (const combo of _forwardedCombos) {
                if (!_eventMatchesCombo(e, combo)) continue;
                e.preventDefault();
                if (combo.metaKey) _forwardedReleaseKeys.add('Meta');
                if (combo.ctrlKey) _forwardedReleaseKeys.add('Control');
                if (combo.altKey) _forwardedReleaseKeys.add('Alt');
                if (combo.shiftKey) _forwardedReleaseKeys.add('Shift');
                _postToParent({
                    type: 'FORWARD_KEYDOWN',
                    key: combo.key, code: e.code, altKey: e.altKey, ctrlKey: e.ctrlKey,
                    shiftKey: e.shiftKey, metaKey: e.metaKey
                });
                return;
            }
        }, { capture: true });

        window.addEventListener('keyup', (e) => {
            if (!_forwardedReleaseKeys.has(e.key)) return;
            _forwardedReleaseKeys.delete(e.key);
            _postToParent({type:'FORWARD_KEYUP',key:e.key,code:e.code,
                altKey:e.altKey,ctrlKey:e.ctrlKey,shiftKey:e.shiftKey,metaKey:e.metaKey});
        }, {capture:true});

        // ---------------------------------------------------------------
        // 3b. Esc double-tap — let the renderer dismiss its own popups
        // (Crepe slash menu, Monaco intellisense, a renderer's own
        // compose popover, …) on a single Esc, and forward to the host
        // only on a second Esc within 600ms.
        //
        // The first Esc must NOT be swallowed: this listener is on
        // `window` with capture:true and runs before the renderer's own
        // listeners, so stopImmediatePropagation here would halt
        // propagation entirely and no renderer popup could ever see an
        // Escape. We only record the timestamp. The generic forwarder
        // above skips bare Escape explicitly, so nothing else acts on it.
        // ---------------------------------------------------------------
        let _lastEscAt = 0;
        const _ESC_DOUBLE_MS = 600;
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            // Ignore Shift/Alt/Ctrl/Meta+Esc — those are distinct
            // combos and not part of the close-editor gesture.
            if (e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
            const now = Date.now();
            if (now - _lastEscAt < _ESC_DOUBLE_MS) {
                // Second Esc — forward to host.
                e.preventDefault();
                e.stopImmediatePropagation();
                _postToParent({
                    type: 'FORWARD_KEYDOWN',
                    key: 'Escape',
                    altKey: false, ctrlKey: false, shiftKey: false, metaKey: false,
                });
                _lastEscAt = 0;
                return;
            }
            // First Esc — record it and get out of the way so the
            // renderer's own listeners receive it (Crepe slash menu
            // close, compose popover dismiss, …).
            _lastEscAt = now;
        }, { capture: true });

        // ---------------------------------------------------------------
        // 3c. OS file drags — files dragged in from the desktop that enter
        // the window over this frame land in this document, out of the
        // host's sight. Tell the host: it makes the renderers
        // pointer-passive, so the drag's next move reaches the canvas and
        // its drop targets. A drag that began in this document (a
        // renderer's own image or block drag) is not one.
        // ---------------------------------------------------------------
        let _ownDrag = false;
        window.addEventListener('dragstart', () => { _ownDrag = true; }, { capture: true });
        window.addEventListener('dragend', () => { _ownDrag = false; }, { capture: true });
        const _forwardOsFileDrag = (e) => {
            if (_ownDrag || !e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
            _postToParent({ type: 'OS_FILE_DRAG' });
        };
        window.addEventListener('dragenter', _forwardOsFileDrag, { capture: true });
        window.addEventListener('dragover', _forwardOsFileDrag, { capture: true });

        // ---------------------------------------------------------------
        // 4. Init — build unified API, fetch content, mount renderer
        // ---------------------------------------------------------------
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const rendererId = params.get('renderer');
            const hashUrl = params.get('hash');
            const diffHashUrl = params.get('diff');
            // Optional names for the diff's two sides (e.g. "v3"/"v4") —
            // surfaced via api.getDiffLabels() so diff views can title
            // their panes instead of generic "Before"/"After".
            const diffBaseLabel = params.get('diffBase');
            const diffCurrentLabel = params.get('diffCurrent');
            const filename = _displayFilename;
            const cellId = params.get('cellId') || '';
            const versionId = params.get('versionId') || '';
            // Channel holding the cell — lets getFileUrl build direct
            // cell-file URLs synchronously (same construction as the native
            // host). Hosts without a cell context (relay draft previews)
            // omit it; the URLs then 404, mirroring the sibling fast-fail.
            const channel = params.get('channel') || '';
            const rendererVersion = params.get('rv') || '';
            // Hard host lock (review cell, diff view). Absent param = false,
            // so every URL built before this existed stays editable.
            _documentReadOnly = params.get('readonly') === '1';
            let apiBase = params.get('apiBase') || '';
            if (apiBase.endsWith('/')) apiBase = apiBase.slice(0, -1);

            // Where api.getFileUrl points. A renderer's own preview frame
            // (the html renderer's page) is sandboxed without
            // allow-same-origin, so its reads of these URLs carry
            // `Origin: null` — like a sandboxed frame on any web page — and
            // the server answers those only on the cell's capability URL,
            // minted by a same-origin GET …/file_cap (see
            // frontend/src/lib/cellFileCap.ts, the native host's copy).
            // Fetched alongside the content, awaited before the mount. With
            // no cell context there are no cell files; the plain shape 404s.
            const capPath = `channels/${encodeURIComponent(channel)}/cells/${encodeURIComponent(versionId || cellId)}`;
            const address = versionId ? `versions/${encodeURIComponent(versionId)}` : `cells/${encodeURIComponent(cellId)}`;
            const cellPath = `channels/${encodeURIComponent(channel)}/${address}`;
            let fileBase = `${apiBase}/api/${cellPath}/files/`;
            const capRequest = (channel && cellId)
                ? fetch(`${apiBase}/api/${capPath}/file_cap`).then(async (r) => {
                    if (!r.ok) throw new Error(`file_cap: HTTP ${r.status}`);
                    const body = await r.json();
                    if (typeof body?.cap !== 'string' || !body.cap) throw new Error('file_cap: no cap in the answer');
                    return body.cap;
                })
                : Promise.resolve('');
            // Settled later (inside the mount's try); this only keeps an early
            // rejection from being reported as unhandled meanwhile.
            capRequest.catch(() => {});

            const mountEl = document.getElementById('mount');

            // Logical document transport asks the checked host for its current owner snapshot.
            let content = '';
            let diffContent = null;
            let contentError = null;
            try {
                if (params.get('document')) {
                    const document = await _previewPrimitive('GET_DOCUMENT',{viewId:_viewId});
                    content = document.content;
                    _documentSnapshot = {content, recovery:document.recovery,
                        editSeq:document.editSeq ?? 0, materializedSeq:document.materializedSeq ?? 0};
                    _documentReadOnly=!!document.readOnly;
                    _canInteract=!!document.canInteract;
                    for (const file of document.files || []) _fileRevisions.set(file.name, file.file_revision);
                    diffContent = document.diffContent;
                } else {
                    if(channel&&cellId){const snapshot=await _previewPrimitive('GET_DOCUMENT',{viewId:_viewId});_canInteract=!!snapshot.canInteract;_documentReadOnly=!!snapshot.readOnly;for(const file of snapshot.files||[])_fileRevisions.set(file.name,file.file_revision);}
                    if (hashUrl) { const response = await fetch(hashUrl); if (!response.ok) throw new Error(`HTTP ${response.status}`); content = await response.text(); }
                    if (diffHashUrl) diffContent = await fetch(diffHashUrl).then(r => r.text());
                }
                _documentContent = content;
                if (!params.get('document')) _documentSnapshot = {content,editSeq:0,materializedSeq:0};
            } catch (error) { contentError = error; }

            // --- Build the unified Renderer API object ---
            const api = {
                getContent:      async () => params.get('document')
                    ? await _previewPrimitive('GET_DOCUMENT_CONTENT') : _documentContent,
                getDocumentSnapshot: async () => _documentSnapshot,
                registerSnapshotCodec: codec => _previewPrimitive('REGISTER_SNAPSHOT_CODEC',{codec}),
                saveSnapshot: snapshot => {
                    if (_documentReadOnly) return;
                    _documentSnapshot = {..._documentSnapshot,recovery:snapshot};
                    _postToParent({type:'FILE_SNAPSHOT_UPDATED',snapshot,viewId:_viewId,viewSeq:++_viewSeq});
                },
                onDocumentSnapshot: cb => { _documentSnapshotCbs.push(cb);return () => {const i=_documentSnapshotCbs.indexOf(cb);if(i>=0)_documentSnapshotCbs.splice(i,1);}; },
                getDiffContent:  async () => diffContent,
                getDiffLabels:   () => (diffBaseLabel || diffCurrentLabel)
                    ? { base: diffBaseLabel || '', current: diffCurrentLabel || '' }
                    : null,
                getFilename:     () => filename,
                getCellId:       () => cellId,
                getSurface:      () => _previewPrimitive('GET_SURFACE'),
                onSurfaceChange: (cb) => { _surfaceChangedCbs.push(cb); return () => { const i = _surfaceChangedCbs.indexOf(cb); if (i >= 0) _surfaceChangedCbs.splice(i, 1); }; },
                getFilePaths: () => _previewPrimitive('FILE_PATHS'),
                preview: {
                    prepareDependencies: (files, entrypoint, signal) => _previewPrimitive('PREPARE_RENDERER_DEPENDENCIES', {files, entrypoint}, signal),
                    compile: (files, entrypoint) => _previewPrimitive('COMPILE_RENDERER', {files, entrypoint}),
                },
                getSiblingFile:  (path) => _getSiblingFile(_realPath(path)),
                // Direct URL for a file in this renderer's OWN cell — for
                // <img src>, <video>, fetch. Same cell-relative addressing
                // as getSiblingFile; pinned to the accepted revision.
                getFileUrl:      (path) => { if(path==='')return fileBase; const realPath=_realPath(path); const url=`${fileBase}${realPath.split('/').map(encodeURIComponent).join('/')}`; if(versionId)return url; const revision=_fileRevisions.get(realPath); if(revision===undefined)throw new Error(`File ${realPath} is unavailable.`); return `${url}?revision=${revision}`; },
                // Ask the host to open a file from this cell in its own tab
                // under its default renderer; newTab opens a fresh tab instead
                // of taking over the active one (fire-and-forget; no-op when
                // the file doesn't exist or the host has no cell context).
                revealFile:      (path, options) => _postToParent({ type: 'REVEAL_FILE', path, newTab: options?.newTab === true }),
                // Committed write into this renderer's own cell, addressed by
                // the same cell-relative path getSiblingFile takes. Resolves
                // false on any failure; never rejects.
                saveSiblingFile: (path, content) => _saveSiblingFile(_realPath(path), content),
                reportChange: (c) => { if (!_documentReadOnly) { _documentContent = c; _postToParent({type:'FILE_UPDATED',content:c,viewId:_viewId,viewSeq:++_viewSeq}); } },
                onSetContent: (cb) => { _setContentCbs.push(cb); return () => { const i=_setContentCbs.indexOf(cb); if(i>=0)_setContentCbs.splice(i,1); }; },
                onFilesChange:  (cb) => { _filesChangedCbs.push(cb); return () => { const i = _filesChangedCbs.indexOf(cb); if (i >= 0) _filesChangedCbs.splice(i, 1); }; },
                // Host content push (loadTag) — apply in place, no reload.
                // Host flush request (Save) — push the latest value through
                // reportChange now. cb may return a promise; the ack waits on it.
                onFlush:         (cb) => { _flushCbs.push(cb); return () => { const i = _flushCbs.indexOf(cb); if (i >= 0) _flushCbs.splice(i, 1); }; },
                // Hard lock from the host (review cell, diff view) — a
                // renderer that respects it must offer no way to edit at all.
                // Softer, renderer-owned modes (e.g. a review-mode flag in a
                // sidecar file) sit UNDER this one.
                isReadOnly:      () => _documentReadOnly,
                canInteract:     () => _canInteract,
                // The host's annotation requests for this view (see the
                // ANNOTATION_REQUEST branch). One handler per view: a second
                // subscription replaces the first. The unsubscribe answers
                // the requests still pending as unsupported.
                onAnnotationRequest: (handler) => {
                    if (typeof handler !== 'function') return () => {};
                    _annotationHandler = handler;
                    _announceAnnotationCapable(false);
                    return () => {
                        if (_annotationHandler !== handler) return;
                        _annotationHandler = null;
                        for (const [requestId, controller] of _annotationJobs) {
                            controller.abort();
                            _answerAnnotation(requestId, { unsupported: true });
                        }
                        _annotationJobs.clear();
                        _announceAnnotationCapable(false);
                    };
                },
                // Helpers for style/script injection that work in both iframe and Shadow DOM
                injectCss:       (css) => { const el = document.createElement('style'); el.textContent = css; document.head.appendChild(el); },
                // Returns a Promise that resolves when the stylesheet has actually
                // loaded — crepe/milkdown needs this so it can await CSS before
                // calling api.ready() and revealing the editor. Without awaiting,
                // the iframe paints unstyled content during the brief load window.
                loadCss: (href) => {
                    // A module-CDN stylesheet loads from the mirror (an import
                    // map covers imports only), compared by its mapped href.
                    const upstream = window.__collimateMirrorHosts.find((host) => href.startsWith(`https://${host}/`));
                    if (upstream) href = `${window.__collimateMirrorBase}${upstream}/${href.slice(`https://${upstream}/`.length)}`;
                    // Attribute compare: a quote/backslash in href would break a selector.
                    const existing = Array.from(document.querySelectorAll('link')).find(l => l.getAttribute('href') === href);
                    if (existing) {
                        if (existing.sheet) return Promise.resolve();
                        return new Promise(resolve => {
                            existing.addEventListener('load', () => resolve(), { once: true });
                            existing.addEventListener('error', () => resolve(), { once: true });
                        });
                    }
                    const l = document.createElement('link');
                    l.rel = 'stylesheet';
                    l.href = href;
                    return new Promise(resolve => {
                        l.addEventListener('load', () => resolve(), { once: true });
                        l.addEventListener('error', () => resolve(), { once: true });
                        document.head.appendChild(l);
                    });
                },
                // Renderer signals "I'm fully painted — drop the overlay." The
                // parent also arms a timeout fallback so a broken renderer never
                // leaves the overlay up forever.
                ready: () => _fireReady(),
                // Theme signal. `getTheme()` returns a snapshot of the
                // host's current theme; `onThemeChange(cb)` subscribes
                // to SET_THEME messages so editors can hot-swap their
                // internal theme (Monaco's defined theme, Crepe's token
                // mapping, …). cb is invoked with the new snapshot
                // AND immediately on subscribe with the current theme,
                // so renderers don't need to call getTheme() separately.
                getTheme: () => _currentTheme,
                onThemeChange: (cb) => {
                    _themeChangeCbs.push(cb);
                    // Fire immediately so subscribers see the current
                    // scheme without a second round trip.
                    try { cb(_currentTheme); } catch (err) { console.error('theme-change callback error:', err); }
                    return () => {
                        const i = _themeChangeCbs.indexOf(cb);
                        if (i >= 0) _themeChangeCbs.splice(i, 1);
                    };
                },
                // Editing preferences ({ spellcheck }). Same shape as the
                // theme signal: a cached snapshot, and a subscription that
                // fires immediately and on every SET_EDITING.
                getEditing: () => _currentEditing,
                onEditingChange: (cb) => {
                    _editingChangeCbs.push(cb);
                    try { cb(_currentEditing); } catch (err) { console.error('editing-change callback error:', err); }
                    return () => {
                        const i = _editingChangeCbs.indexOf(cb);
                        if (i >= 0) _editingChangeCbs.splice(i, 1);
                    };
                },
                // This renderer's style choices ({ theme, font, textSize }, null
                // = its default). Same shape as the theme signal; setStyle
                // asks the host to persist a patch, which the host keeps
                // under this frame's own renderer id and pushes back as
                // SET_STYLE. getFontFamilies is the catalogue the style
                // control's font row offers.
                getStyle: () => ({ ..._currentStyle }),
                onStyleChange: (cb) => {
                    _styleChangeCbs.push(cb);
                    try { cb({ ..._currentStyle }); } catch (err) { console.error('style-change callback error:', err); }
                    return () => {
                        const i = _styleChangeCbs.indexOf(cb);
                        if (i >= 0) _styleChangeCbs.splice(i, 1);
                    };
                },
                setStyle: (patch) => {
                    if (!patch || typeof patch !== 'object') return;
                    const clean = {};
                    for (const key of ['theme', 'font', 'textSize']) {
                        if (Object.prototype.hasOwnProperty.call(patch, key)) clean[key] = patch[key];
                    }
                    _postToParent({ type: 'SET_STYLE_PATCH', patch: clean });
                },
                getFontFamilies: () => _fontFamilies,
            };

            // The parent owns cache lookup and worker compilation. One token
            // names this shell request; renderer code is never accepted from
            // another window/origin or from a superseded shell identity.
            const token = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
            try {
                if (contentError) throw new Error(`could not read the file's content (${contentError.message || contentError})`);
                const sourceCode = await new Promise((resolve, reject) => {
                    const request = () => window.parent.postMessage({type:'RENDERER_BUNDLE_REQUEST', token,
                        rendererId, rendererHash: rendererVersion}, window.location.origin);
                    const receive = (event) => {
                        if (event.source !== window.parent || event.origin !== window.location.origin) return;
                        const data = event.data;
                        if (data?.type !== 'RENDERER_BUNDLE_RESULT' || data.token !== token) return;
                        clearInterval(retry); clearTimeout(timeout); window.removeEventListener('message', receive);
                        if (typeof data.error === 'string') reject(new Error(data.error));
                        else if (typeof data.code === 'string') resolve(data.code);
                        else reject(new Error('Invalid renderer bundle response'));
                    };
                    window.addEventListener('message', receive);
                    const retry = setInterval(request, 250);
                    const timeout = setTimeout(() => {
                        clearInterval(retry); window.removeEventListener('message', receive);
                        reject(new Error('Renderer bundle request timed out'));
                    }, 35000);
                    request();
                });
                const fullApiBase = apiBase.startsWith('http') ? apiBase
                    : new URL(apiBase + '/', window.location.href).toString().replace(/\/$/, '');
                const code = sourceCode.replace(/['"]\/api\/sdk\/(.*?)['"]/g, `"${fullApiBase}/api/sdk/$1"`);
                const finalUrl = URL.createObjectURL(new Blob([code], {type:'application/javascript'}));
                window.addEventListener('pagehide', () => URL.revokeObjectURL(finalUrl), {once:true});
                let moduleObj;
                try { moduleObj = await import(finalUrl); }
                catch (error) { URL.revokeObjectURL(finalUrl); throw error; }

                // Unwrap default export for new SDK renderers
                const renderer = moduleObj.default || moduleObj;

                const cap = await capRequest;
                if (cap) fileBase = `${apiBase}/api/cellcap/${encodeURIComponent(cap)}/${cellPath}/files/`;

                if (diffHashUrl && typeof renderer.mountDiff === 'function') {
                    await renderer.mountDiff(mountEl, api);
                } else if (typeof renderer.mount === 'function') {
                    await renderer.mount(mountEl, api);
                } else {
                    throw new Error(`Renderer '${rendererId}' does not export mount()`);
                }
            } catch (err) {
                console.error(err);
                mountEl.style.cssText = 'color:red;padding:10px;font-family:monospace;';
                mountEl.textContent = `Failed to load renderer: ${err.message}`;
            }
        }

        // ---------------------------------------------------------------
        // 5. Wait for layout before init (prevents narrow-mode lock)
        // ---------------------------------------------------------------
        function waitForWidth() {
            if (window.innerWidth > 100) return Promise.resolve();
            return new Promise(resolve => {
                requestAnimationFrame(function poll() {
                    if (window.innerWidth > 100) { resolve(); return; }
                    requestAnimationFrame(poll);
                });
            });
        }

        waitForWidth().then(init);
    </script>
</body>
</html>
