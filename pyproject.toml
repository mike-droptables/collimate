# The one distribution, `collimate`: the server (`collimate_server`, in
# api/collimate_server/), the SDK it runs generators and renderers against
# (`collimate` and `gen`, in sdk/src/), the first-party trees it reads
# (content/, builtins/, module-snapshot/) and the built UI. One version for
# this file, desktop/package.json and the release tag (build/release_policy.py).
[project]
name = "collimate"
version = "0.1.2"
description = "Collimate: a local-first workbench for working with language models in parallel"
# README is the PyPI long description; it also travels as the description
# in the SDK's canonical metadata (sdk/src/collimate/_sdk_metadata/METADATA).
readme = "api/README.md"
# The server needs 3.13. The SDK packages still run on 3.12 where the
# generators' PEP 723 headers allow it (they reach them as source, never as
# this distribution); sdk/ruff.toml keeps them at 3.12 syntax.
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Collimate contributors" },
]
keywords = ["collimate", "llm", "workbench", "generators", "renderers", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # The SDK's only runtime requirement, and so all that the container base
    # image installs beside the SDK packages it stages
    # (collimate.shared.SDK_REQUIREMENTS names it; a test keeps them equal).
    "pyyaml>=6.0",
    # Host-placed environments (process_manager/environments.py): the host
    # owns every docker call for the env_* IPC ops — generators declare
    # placements, they never touch a daemon.
    "docker>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # Imported by routes/proxy.py, and uvicorn (no [standard]) needs it to
    # serve every WebSocket route; declared rather than left transitive.
    "websockets>=17,<18",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "keyring>=25.0",
    # The self-signed certificate `--listen` mints (listen_identity.py).
    "cryptography>=42",
]

[dependency-groups]
dev = [
    # Match the separately bootstrapped CI lint job; typechecking uses this env.
    "ruff==0.17.2",
    "pyright==1.1.414",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.6",
    "playwright>=1.64.1,<2",
    "build>=1.2",
    # The ACP client (acp_client / acp_run) lazily imports the pinned
    # `agent-client-protocol` python SDK — the Agent generators' PEP 723
    # header declares the same pin; this puts it in reach of the normalizer /
    # declaration-shape unit tests and the live conformance suite.
    "agent-client-protocol==0.12.1",
    # Same tested native-protocol server/client pair as the agent PEP723.
    "mcp==2.3.0",
    # The rest of the Agent generators' PEP 723 tool stack, mirrored so tests
    # exercise its actual MCP server and web extractors, not optional fallbacks.
    # The full FastMCP server is needed beyond the slim model dependency.
    # httpx2 follows the entrypoint's HTTP-stack floor.
    "fastmcp==4.1.3",
    "trafilatura",
    "ddgs",
    "httpx2>=2.13",
    # The web-generator test suite imports aiohttp (previously present only
    # transitively — a silent skip when it vanished).
    "aiohttp>=3.9",
    # The SDK tests import these themselves (the environment tests docker,
    # the MCP and web tests uvicorn and httpx), so they hold where only the
    # SDK's own requirement is installed, as on sdk-ci.yml's Python 3.12 leg.
    "docker>=7",
    "uvicorn",
    "httpx",
]

[project.scripts]
# `collimate` starts the server on http://localhost:5001 (collimate_server.main
# cli_main; `python -m collimate_server` is the same). The desktop app in
# desktop/ runs it for you.
collimate = "collimate_server.main:cli_main"
# The manifest linter authors run over their definitions.
collimate-lint = "collimate.lint.cli:main"

[project.urls]
Homepage = "https://github.com/mike-droptables/collimate"
Repository = "https://github.com/mike-droptables/collimate"
Issues = "https://github.com/mike-droptables/collimate/issues"
Documentation = "https://github.com/mike-droptables/collimate/tree/main/sdk/shared/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# build/hatch_build.py adds everything the wheel carries beside the Python
# packages, and builds or verifies it first: the SDK's package data
# (sdk/shared as collimate/shared, the renderer compilers and tools), its
# renderer runtime and verifier prelude, the native verifier payload for the
# wheel's target (all four in the sdist), content/, builtins/ and
# module-snapshot/ (as collimate_content/, collimate_builtins/,
# collimate_module_snapshot/), the built UI (collimate_server/static/) and
# the .pth that puts the SDK's directory on sys.path. An editable install
# builds and copies none of it: a checkout reads them in place
# (collimate.shared, collimate_server.genesis.bundled_dir).
[tool.hatch.build.hooks.custom]
path = "build/hatch_build.py"

# The SDK packages, collimate and gen, go into a directory of their own,
# collimate-run-sdk/ (collimate.shared.WHEEL_SDK_HOME), so a generator run's
# PYTHONPATH is that directory and holds none of the server's dependencies;
# the server package sits in site-packages as usual. An editable install puts
# sdk/src and api on sys.path, and sdk/src likewise holds only the two.
[tool.hatch.build.targets.wheel]
only-include = ["sdk/src/collimate", "sdk/src/gen", "api/collimate_server"]
sources = { "sdk/src" = "collimate-run-sdk", "api" = "" }
dev-mode-dirs = ["sdk/src", "api"]
# Ignored by version control and added by the hook, so never by the glob.
exclude = ["/sdk/src/collimate/native_verifier", "/api/collimate_server/static"]

# The sdist rebuilds every target's wheel with no network, Node or compiler:
# the sources, plus what the hook forces in (the prepared compilers, all four
# verifier payloads, the built runtime and prelude, the three trees with the
# snapshot's bodies, the UI).
[tool.hatch.build.targets.sdist]
only-include = ["api/collimate_server", "sdk", "build/hatch_build.py"]
exclude = ["/sdk/tests", "/sdk/tests_live", "/sdk/tmp", "/sdk/build", "/sdk/dist",
           "/api/collimate_server/static", "/sdk/src/collimate/native_verifier"]

# The lock alone, not the published metadata: cryptography 49.0.0 dropped the
# macOS x86_64 (universal2) wheel, and the darwin-x64 desktop package's server
# environment installs exactly the lock's binary wheels (build/server_env.py),
# so the lock keeps an Intel Mac on the last release with one. pip, resolving
# `cryptography>=42` binary-only on an Intel Mac, already picks it.
[tool.uv]
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
# Both suites from the root: the SDK's (sdk/tests, test_*.py) and the
# server's (api/tests, test_pytest_*.py; its three standalone harness
# scripts run through test_pytest_standalone.py, and api/tests/conftest.py
# keeps them from being collected twice). The opt-in live suites,
# sdk/tests_live and api/tests_live, are never collected by a bare `pytest`.
testpaths = ["sdk/tests", "api/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "live: needs real provider credentials / network; excluded by default (testpaths)",
    "real_channel_homes: no channel folder is made for a channel id the test never created (api/tests/conftest.py)",
]

# The server's lint; sdk/ruff.toml holds the SDK's own (3.12 syntax).
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pycodestyle errors + pyflakes. E402 (deferred imports for circular-import
# avoidance), E701 (one-line guards), and E741 are deliberate house style.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E741"]

# pyright runs from the repo root (`uv run pyright`) against the synced venv,
# where the editable install resolves collimate_server, collimate and gen.
# The build hook runs only inside the build backend's own environment.
[tool.pyright]
include = ["api/collimate_server"]
exclude = ["api/collimate_server/static", ".venv", "**/node_modules", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# SDK imports are function-level; don't fail the check when only a partial
# SDK is importable.
reportMissingModuleSource = false
