[project]
name = "collimate-sdk"
version = "0.1.0"
description = "SDK for building Collimate generators and renderers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Collimate SDK contributors" },
]
keywords = ["collimate", "sdk", "generator", "renderer", "llm", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.17.2",
    "build>=1.2",
    # The ACP client (acp_client / acp_run) lazily imports the pinned
    # `agent-client-protocol` python SDK — the Agent generators' PEP 723
    # header declares the same pin; this puts it in reach of the normalizer /
    # declaration-shape unit tests and the live conformance suite.
    "agent-client-protocol==0.12.1",
    # Same tested native-protocol server/client pair as the agent PEP723.
    "mcp==2.3.0",
    "uvicorn",
    # The rest of the Agent generators' PEP 723 tool stack, mirrored so tests
    # exercise its actual MCP server and web extractors, not optional fallbacks.
    # The full FastMCP server is needed beyond the slim model dependency.
    # httpx2 follows the entrypoint's HTTP-stack floor.
    "fastmcp==4.1.3",
    "trafilatura",
    "ddgs",
    "httpx",
    "httpx2>=2.13",
    # _env_shared.DockerEnvironment image-resolution tests import docker
    # directly; the generators themselves declare it via PEP 723.
    "docker>=7",
    # The web-generator test suite imports aiohttp (previously present only
    # transitively — a silent skip when it vanished).
    "aiohttp>=3.9",
]

[project.scripts]
collimate-lint = "collimate.lint.cli:main"

[project.urls]
Homepage = "https://github.com/mike-droptables/collimate"
Repository = "https://github.com/mike-droptables/collimate/tree/main/sdk"
Issues = "https://github.com/mike-droptables/collimate/issues"
Documentation = "https://github.com/mike-droptables/collimate-sdk/tree/main/shared/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
"build/renderer_compilers" = "build/renderer_compilers"
"src/collimate/native_verifier" = "src/collimate/native_verifier"

[tool.hatch.build.targets.wheel]
packages = ["src/collimate", "src/gen"]
exclude = ["/src/collimate/native_verifier/**"]

# Ship the shared asset tree as package data so
# `importlib.resources.files("collimate") / "shared" / ...` resolves after
# pip install; in-tree development falls back to the checkout's shared/
# (src/collimate/shared.py). The first-party content trees live at the
# workspace root and ship in the `collimate` wheel (api/hatch_build.py).
[tool.hatch.build.targets.wheel.force-include]
"build/renderer_compilers" = "collimate/renderer_compilers"
"shared" = "collimate/shared"
"scripts/renderer_bundle.mjs" = "collimate/renderer_tools/renderer_bundle.mjs"
"scripts/renderer_bundle_core.mjs" = "collimate/renderer_tools/renderer_bundle_core.mjs"
"scripts/renderer_bundle_core.d.mts" = "collimate/renderer_tools/renderer_bundle_core.d.mts"
"scripts/package.json" = "collimate/renderer_tools/package.json"
"scripts/package-lock.json" = "collimate/renderer_tools/package-lock.json"
"scripts/bundle_renderer_test.mjs" = "collimate/renderer_tools/bundle_renderer_test.mjs"

[tool.pytest.ini_options]
# `tests` only: the opt-in live suite lives in the sibling `tests_live/` tree and
# is therefore never collected by a bare `pytest`. Running it is an explicit
# `uv run pytest tests_live` (see tests_live/README.md) — the default suite must
# stay offline and free.
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: needs real provider credentials / network; excluded by default (testpaths)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lint the SDK proper and the test suite.

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E741"]
